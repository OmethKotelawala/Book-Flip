<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NSBM Annual Report 2025-2026 - Digital 3D Flipbook</title>
  <meta name="description" content="Interactive 3D digital annual report reader with realistic page flips, search, thumbnails, and high-resolution PDF rendering.">
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PDF.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">
  <div id="app-container" class="app-container">
    
    <!-- Top Header Bar -->
    <header id="top-bar" class="top-bar">
      <div class="top-left">
        <div class="brand-badge">
          <svg class="book-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          <span class="report-title">NSBM Green University • Annual Report 2025-2026</span>
        </div>
      </div>

      <div class="top-center">
        <!-- Page Jump Navigation -->
        <div class="page-nav-pill">
          <button id="btn-first" class="btn-icon-subtle" title="First Page (Home)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
          </button>
          
          <div class="page-counter-box">
            <span class="page-label">Page</span>
            <input type="number" id="page-input" min="1" max="1" value="1" aria-label="Page number">
            <span class="page-slash">/</span>
            <span id="page-total" class="page-total">--</span>
          </div>

          <button id="btn-last" class="btn-icon-subtle" title="Last Page (End)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
          </button>
        </div>
      </div>

      <div class="top-right">
        <!-- Search Toggle -->
        <button id="btn-toggle-search" class="btn-tool" title="Search Text (Ctrl+F / Cmd+F)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span class="btn-label">Search</span>
        </button>

        <!-- Thumbnails Toggle -->
        <button id="btn-toggle-thumbs" class="btn-tool" title="Thumbnail Overview">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span class="btn-label">Pages</span>
        </button>

        <!-- Table of Contents / Outline -->
        <button id="btn-toggle-outline" class="btn-tool" title="Table of Contents">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
          <span class="btn-label">Contents</span>
        </button>

        <div class="divider-v"></div>

        <!-- Sound Effect Toggle -->
        <button id="btn-sound" class="btn-icon" title="Toggle Flip Sound">
          <svg id="sound-icon-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          <svg id="sound-icon-off" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        </button>

        <!-- Fullscreen -->
        <button id="btn-fullscreen" class="btn-icon" title="Toggle Fullscreen (F)">
          <svg id="fs-icon-enter" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          <svg id="fs-icon-exit" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>
        </button>
      </div>
    </header>

    <!-- Side Search Flyout Panel -->
    <aside id="search-panel" class="side-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search Report</span>
        </div>
        <button id="btn-close-search" class="btn-close" title="Close Search">✕</button>
      </div>
      
      <div class="search-input-wrapper">
        <input type="text" id="search-query" placeholder="Type text to find..." autocomplete="off">
        <button id="btn-search-exec" class="btn-search-go" title="Find">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="search-stats" id="search-stats">Enter keyword to search across all pages</div>
      
      <div class="search-results-list" id="search-results-list">
        <!-- Dynamic search results populated here -->
      </div>
    </aside>

    <!-- Side Table of Contents Flyout Panel -->
    <aside id="outline-panel" class="side-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line></svg>
          <span>Table of Contents</span>
        </div>
        <button id="btn-close-outline" class="btn-close" title="Close Contents">✕</button>
      </div>
      <div class="outline-list" id="outline-list">
        <!-- Outline items populated here -->
      </div>
    </aside>

    <!-- Main Flipbook Stage Area -->
    <main id="stage" class="stage">
      
      <!-- Side Navigation Arrow: Previous -->
      <button id="btn-prev" class="nav-arrow nav-arrow-left" title="Previous Page (Left Arrow / Drag Left)">
        <div class="nav-arrow-inner">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
      </button>

      <!-- 3D Book Viewport Container -->
      <div id="book-viewport" class="book-viewport">
        <!-- Ambient Ground Reflection / Shadow -->
        <div class="book-ambient-shadow"></div>

        <!-- 3D Book Container -->
        <div id="book" class="book">
          <!-- Left Spine Thickness Stack -->
          <div id="stack-left" class="page-stack stack-left"></div>

          <!-- Left Page Frame -->
          <div id="page-left-wrapper" class="page-wrapper page-left">
            <div id="page-left" class="page-surface">
              <canvas id="canvas-left" class="page-canvas"></canvas>
              <div class="spine-shadow spine-shadow-left"></div>
              <div class="page-highlight"></div>
              <div class="page-num-badge page-num-left" id="num-left"></div>
            </div>
          </div>

          <!-- Central Book Spine Crease -->
          <div class="book-spine-crease"></div>

          <!-- Right Page Frame -->
          <div id="page-right-wrapper" class="page-wrapper page-right">
            <div id="page-right" class="page-surface">
              <canvas id="canvas-right" class="page-canvas"></canvas>
              <div class="spine-shadow spine-shadow-right"></div>
              <div class="page-highlight"></div>
              <div class="page-num-badge page-num-right" id="num-right"></div>
            </div>
          </div>

          <!-- 3D Dynamic Flipping Leaf Layer -->
          <div id="flip-leaf" class="flip-leaf">
            <div id="leaf-front" class="leaf-face leaf-front">
              <canvas id="canvas-leaf-front" class="page-canvas"></canvas>
              <div class="spine-shadow spine-shadow-right"></div>
              <div class="dynamic-shadow shadow-front" id="shadow-front"></div>
            </div>
            <div id="leaf-back" class="leaf-face leaf-back">
              <canvas id="canvas-leaf-back" class="page-canvas"></canvas>
              <div class="spine-shadow spine-shadow-left"></div>
              <div class="dynamic-shadow shadow-back" id="shadow-back"></div>
            </div>
          </div>

          <!-- Right Spine Thickness Stack -->
          <div id="stack-right" class="page-stack stack-right"></div>

          <!-- Interactive Corner Drag Hotspots for flipping -->
          <div id="drag-zone-right" class="drag-zone drag-zone-right" title="Drag corner to flip page">
            <div class="corner-fold-hint corner-fold-br"></div>
            <div class="corner-fold-hint corner-fold-tr"></div>
          </div>
          <div id="drag-zone-left" class="drag-zone drag-zone-left" title="Drag corner to flip back">
            <div class="corner-fold-hint corner-fold-bl"></div>
            <div class="corner-fold-hint corner-fold-tl"></div>
          </div>
        </div>
      </div>

      <!-- Side Navigation Arrow: Next -->
      <button id="btn-next" class="nav-arrow nav-arrow-right" title="Next Page (Right Arrow / Drag Right)">
        <div class="nav-arrow-inner">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </div>
      </button>

      <!-- Zoom Pan Floating Reset Pill (shown when zoomed) -->
      <div id="zoom-float-hint" class="zoom-float-hint hidden">
        <span>Zoomed In • Drag to pan</span>
        <button id="btn-zoom-reset-hint">Reset</button>
      </div>

      <!-- Loading / Progress Overlay -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loader-content">
          <div class="book-loader">
            <div class="book-loader-page"></div>
            <div class="book-loader-page"></div>
            <div class="book-loader-page"></div>
          </div>
          <div class="loader-text" id="loader-status">Initializing NSBM Annual Report...</div>
          <div class="progress-bar-container">
            <div class="progress-bar" id="load-progress"></div>
          </div>
          <div class="loader-subtext">Loading ultra-crisp vector pages & high resolution assets</div>
        </div>
      </div>
    </main>

    <!-- Bottom Floating Dock Toolbar -->
    <footer id="bottom-bar" class="bottom-bar">
      <div class="bottom-dock">
        <!-- View Mode Toggle (Single Page vs Two Page Spread) -->
        <button id="btn-toggle-spread" class="dock-btn" title="Toggle Single / Spread View">
          <svg id="icon-spread-double" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          <span class="dock-tooltip">Layout Mode</span>
        </button>

        <div class="dock-divider"></div>

        <!-- Zoom Out -->
        <button id="btn-zoom-out" class="dock-btn" title="Zoom Out (-)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          <span class="dock-tooltip">Zoom Out</span>
        </button>

        <!-- Zoom Level Indicator / Reset -->
        <button id="btn-zoom-val" class="dock-zoom-val" title="Click to Reset Zoom">
          <span id="zoom-percent">100%</span>
        </button>

        <!-- Zoom In -->
        <button id="btn-zoom-in" class="dock-btn" title="Zoom In (+)">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
          <span class="dock-tooltip">Zoom In</span>
        </button>

        <div class="dock-divider"></div>

        <!-- Auto Play / Slideshow -->
        <button id="btn-autoplay" class="dock-btn" title="Autoplay Slideshow (Space)">
          <svg id="play-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
          <svg id="pause-icon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          <span class="dock-tooltip">Auto Flip</span>
        </button>

        <!-- Download Original PDF -->
        <a id="btn-download" class="dock-btn" href="https://raw.githubusercontent.com/OmethKotelawala/NSBM-AR/main/NSBM%20AR%202025-2026%20Book%20(1).pdf" target="_blank" download="NSBM-AR-2025-2026.pdf" title="Download PDF">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span class="dock-tooltip">Download PDF</span>
        </a>
      </div>
    </footer>

    <!-- Bottom Thumbnail Slider Drawer -->
    <div id="thumbs-drawer" class="thumbs-drawer">
      <div class="thumbs-drawer-header">
        <span>Page Thumbnails Preview</span>
        <button id="btn-close-thumbs" class="btn-close" title="Close Thumbnails">✕</button>
      </div>
      <div class="thumbs-scroll-track" id="thumbs-container">
        <!-- Thumbnails populated dynamically -->
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
